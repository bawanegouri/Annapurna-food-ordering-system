<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annapurna Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-warning">
    <div class="container">
        <span class="navbar-brand fw-bold">🍽 Annapurna</span>

        <a href="/" class="btn btn-light">
            Logout
        </a>
    </div>
</nav>

<div class="container py-5">

   <div class="text-center mb-4">

    <h2 class="fw-bold">
        👋 Welcome, <span id="customerName">Customer</span>!
    </h2>

    <p class="text-muted">
        Ready to order something delicious?
    </p>

</div>

    <div class="row">

        <div class="col-md-4 mb-4">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h3>🍛</h3>

                    <h5>Browse Menu</h5>

                    <a href="/customer/menu"
                       class="btn btn-warning mt-3">
                        Open Menu
                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-4 mb-4">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h3>🛒</h3>

                    <h5>My Cart</h5>

                    <a href="/customer/cart"
                       class="btn btn-warning mt-3">
                        View Cart
                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-4 mb-4">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h3>📦</h3>

                    <h5>My Orders</h5>

                    <a href="/customer/orders"
                       class="btn btn-warning mt-3">
                        View Orders
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<footer class="text-center py-4 mt-5 bg-dark text-white">

    <h5>
        🍽 Annapurna
    </h5>

    <p class="mb-1">
        Pure Vegetarian Food Ordering System
    </p>


    <small>
        © 2026 Annapurna
    </small>

</footer>
<script>

fetch("/api/current-user")
    .then(response => response.json())
    .then(user => {

        if (user.success && user.name) {

            document.getElementById("customerName").textContent =
                user.name;

        }

    })
    .catch(error => {
        console.error("Unable to load user:", error);
    });

</script>
</body>
</html>
