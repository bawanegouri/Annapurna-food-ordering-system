<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Orders | Annapurna</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:Poppins,sans-serif;
    background:linear-gradient(135deg,#fff8e1,#ffe0b2);
    min-height:100vh;
}

.orders-card{
    background:white;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.12);
}

.table th{
    background:#ff9800;
    color:white;
}


</style>

</head>

<body>

<div class="container py-5">

<div class="orders-card p-4">

<div class="text-center mb-4">

<h2 class="fw-bold text-warning">
📦 My Orders
</h2>

<p class="text-muted">
Track all your delicious Annapurna orders.
</p>

</div>

<table class="table table-hover text-center">

<thead>

<tr>

<th>Order ID</th>
<th>Name</th>
<th>Total</th>
<th>Status</th>

</tr>

</thead>

<tbody id="ordersTable">

</tbody>

</table>

<div class="text-center mt-4">

<a href="/customer/menu"
class="btn btn-warning">

🍛 Back to Menu

</a>

</div>

</div>

</div>

<hr class="my-5">

<div class="container">

    <h3 class="fw-bold mb-4">
        ⭐ Rate Your Food
    </h3>

    <div class="card shadow-sm border-0 p-4">

        <div class="mb-3">

            <label class="form-label fw-semibold">
                Rating
            </label>

            <select
                id="rating"
                class="form-select">

                <option value="5">
                    ⭐⭐⭐⭐⭐ Excellent
                </option>

                <option value="4">
                    ⭐⭐⭐⭐ Very Good
                </option>

                <option value="3">
                    ⭐⭐⭐ Good
                </option>

                <option value="2">
                    ⭐⭐ Average
                </option>

                <option value="1">
                    ⭐ Poor
                </option>

            </select>

        </div>


        <div class="mb-3">

            <label class="form-label fw-semibold">
                Write Your Review
            </label>

            <textarea
                id="reviewText"
                class="form-control"
                rows="4"
                placeholder="Tell us about your food...">
            </textarea>

        </div>


        <button
            type="button"
            class="btn btn-warning"
            onclick="submitReview(1)">

            ⭐ Submit Review

        </button>

    </div>


    <div id="submittedReviews"
         class="mt-4">

    </div>

</div>

<script src="/js/orders.js"></script>

<footer class="text-center py-4 mt-5 bg-dark text-white">

    <h5>
        🍽 Annapurna
    </h5>

    <p class="mb-1">
        Pure Vegetarian Food Ordering System
    </p>


    <small>
        © 2026 Annapurna
    </small>

</footer>

<script src="/js/reviews.js"></script>
</body>
</html>
