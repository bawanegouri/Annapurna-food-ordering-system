<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Annapurna</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:Poppins,sans-serif;
    background:linear-gradient(135deg,#fff8e1,#ffe0b2);
    min-height:100vh;
}

.checkout-card{
    background:white;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.12);
}

.form-control{
    border-radius:12px;
    padding:12px;
}

.btn-order{
    background:#ff9800;
    color:white;
    font-weight:600;
    border-radius:12px;
    padding:12px;
}

.btn-order:hover{
    background:#f57c00;
    color:white;
}

.logo{
    font-size:42px;
}

</style>

</head>
<body>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-7">

<div class="checkout-card p-5">

<div class="text-center mb-4">

<div class="logo">🍽️</div>

<h2 class="fw-bold text-warning">
Checkout
</h2>

<p class="text-muted">
Almost there! Enter your delivery details.
</p>

</div>

<form action="/place-order" method="POST">

<div class="mb-3">

<label class="form-label">Full Name</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">Phone Number</label>

<input
type="text"
name="phone"
class="form-control"
required>

</div>

<div class="mb-4">

<label class="form-label">Delivery Address</label>

<textarea
name="address"
rows="4"
class="form-control"
required></textarea>

</div>

<button class="btn btn-order w-100">
Place Order 🍛
</button>

</form>

</div>

</div>

</div>

</div>

<div class="container mt-3">

    <button
        class="btn btn-outline-warning rounded-pill px-4"
        onclick="history.back()">

        ← Back

    </button>

</div>

<footer class="text-center py-4 mt-5 bg-dark text-white">

    <h5>
        🍽 Annapurna
    </h5>

    <p class="mb-1">
        Pure Vegetarian Food Ordering System
    </p>


    <small>
        © 2026 Annapurna
    </small>

</footer>

</body>
</html>
