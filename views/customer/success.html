<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Successful</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:Poppins,sans-serif;
    background:linear-gradient(135deg,#43cea2,#185a9d);
    min-height:100vh;
}

.success-card{
    background:white;
    border-radius:25px;
    padding:50px;
    max-width:600px;
    text-align:center;
    box-shadow:0 20px 45px rgba(0,0,0,.25);
    animation:pop .5s ease;
}

@keyframes pop{

0%{
    transform:scale(.7);
    opacity:0;
}

100%{
    transform:scale(1);
    opacity:1;
}

}

.tick{
    width:110px;
    height:110px;
    background:#4CAF50;
    border-radius:50%;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    color:white;
}

.btn-home{
    background:#ff9800;
    color:white;
    padding:12px 30px;
    border-radius:10px;
    font-weight:600;
}

.btn-home:hover{
    background:#f57c00;
    color:white;
}

</style>

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="success-card">

                <div class="tick">
                    ✓
                </div>

                <h1 class="mt-4 fw-bold text-success">
                    Order Confirmed!
                </h1>

                <p class="text-muted mt-3">
                    Thank you for choosing <b>Annapurna</b>.
                    <br>
                    Your delicious vegetarian meal is being prepared with care.
                </p>

                <div class="alert alert-warning mt-4">

                    Estimated Delivery Time

                    <h4 class="mt-2">
                        30 - 40 Minutes
                    </h4>

                </div>

                <button class="btn btn-home"
                        onclick="window.location='/customer/orders'">

                    📦 View My Orders

                </button>

            </div>

        </div>

    </div>

    <div class="text-center mt-4">

        <button class="btn btn-outline-warning rounded-pill px-4"
                onclick="history.back()">

            ← Back

        </button>

    </div>

</div>

<footer class="text-center py-4 mt-5 bg-dark text-white">

    <h5>🍽 Annapurna</h5>

    <p class="mb-1">
        Pure Vegetarian Food Ordering System
    </p>

    <small>
        Made using HTML • CSS • JavaScript • Node.js • Express
    </small>

    <br>

    <small>
        © 2026 Annapurna
    </small>

</footer>

</body>
</html>
