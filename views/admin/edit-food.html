<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Food</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{

font-family:Poppins,sans-serif;

background:linear-gradient(135deg,#11998e,#38ef7d);

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

}

.card{

width:650px;

border:none;

border-radius:20px;

box-shadow:0 15px 35px rgba(0,0,0,.25);

}

.card-header{

background:#11998e;

color:white;

text-align:center;

font-size:28px;

font-weight:600;

padding:20px;

}

.btn-update{

background:#11998e;

color:white;

font-weight:600;

}

.btn-update:hover{

background:#0d7a70;

color:white;

}

</style>

</head>

<body>

<div class="card">

<div class="card-header">

✏ Edit Dish

</div>

<div class="card-body p-4">

<form id="editForm">

<div class="mb-3">

<label>Dish Name</label>

<input
type="text"
id="name"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Price</label>

<input
type="number"
id="price"
name="price"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Category</label>

<select
id="category"
name="category"
class="form-select">

<option>North Indian</option>
<option>South Indian</option>
<option>Street Food</option>
<option>Snacks</option>
<option>Desserts</option>
<option>Beverages</option>

</select>

</div>


<button
class="btn btn-update w-100">

Update Dish

</button>

</form>

</div>

</div>

<div class="container mt-3">

    <button
        class="btn btn-outline-warning rounded-pill px-4"
        onclick="history.back()">

        ← Back

    </button>

</div>

<script>

const id = window.location.pathname.split("/").pop();

fetch("/api/dish/" + id)
.then(res => res.json())
.then(dish => {

    document.getElementById("name").value = dish.name;
    document.getElementById("price").value = dish.price;
    document.getElementById("category").value = dish.category;

});

document.getElementById("editForm").action =
"/admin/update-food/" + id;

</script>

<footer class="text-center py-4 mt-5 bg-dark text-white">

    <h5>
        🍽 Annapurna
    </h5>

    <p class="mb-1">
        Pure Vegetarian Food Ordering System
    </p>

    <small>
        © 2026 Annapurna
    </small>

</footer>

</body>
</html>
