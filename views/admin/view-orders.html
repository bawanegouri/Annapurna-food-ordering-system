<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Orders | Annapurna</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:Poppins,sans-serif;
    background:linear-gradient(135deg,#fff8e1,#ffe0b2);
    min-height:100vh;
}

.orders-card{
    background:white;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.12);
}

.table th{
    background:#ff9800;
    color:white;
}

.status{
    background:#198754;
    color:white;
    padding:6px 12px;
    border-radius:20px;
    font-size:14px;
}

</style>

</head>

<body>

<div class="container py-5">

<div class="orders-card p-4">

<div class="text-center mb-4">

<h2 class="text-warning">
📦 Customer Orders
</h2>

<p class="text-muted">
All orders placed by customers.
</p>

</div>

<table class="table table-hover text-center">
<thead>

<tr>

<th>Order ID</th>

<th>Customer</th>

<th>Phone</th>

<th>Address</th>

<th>Total</th>

<th>Status</th>

<th>Items</th>

</tr>

</thead>
<tbody id="ordersTable">

</tbody>

</table>

<div class="text-center mt-4">

<a href="/admin/dashboard"
class="btn btn-warning">

🍛 Back to Dashboard

</a>

</div>

</div>

</div>

<div class="container mt-3">

    <button
        class="btn btn-outline-warning rounded-pill px-4"
        onclick="history.back()">

        ← Back

    </button>

</div>

<script src="/js/admin-orders.js"></script>

<footer class="text-center py-4 mt-5 bg-dark text-white">

    <h5>
        🍽 Annapurna
    </h5>

    <p class="mb-1">
        Pure Vegetarian Food Ordering System
    </p>


    <small>
        © 2026 Annapurna
    </small>

</footer>

</body>
</html>
