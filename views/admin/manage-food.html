<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Food | Annapurna</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:linear-gradient(135deg,#fff7e6,#ffe8cc,#ffd6a5);

min-height:100vh;

}

.header{

background:#8B4513;

color:white;

padding:25px;

text-align:center;

box-shadow:0 5px 20px rgba(0,0,0,.2);

}

.header h1{

font-weight:700;

}

.top-buttons{

display:flex;

justify-content:center;

gap:15px;

margin:35px 0;

}

.btn-orange{

background:#d97706;

color:white;

border:none;

padding:12px 28px;

border-radius:12px;

font-weight:600;

}

.btn-orange:hover{

background:#b45309;

color:white;

}

.btn-brown{

background:#5d4037;

color:white;

border:none;

padding:12px 28px;

border-radius:12px;

font-weight:600;

}

.btn-brown:hover{

background:#3e2723;

color:white;

}

.food-card{

background:white;

border:none;

border-radius:20px;

overflow:hidden;

box-shadow:0 10px 25px rgba(0,0,0,.12);

transition:.3s;

}

.food-card:hover{

transform:translateY(-8px);

box-shadow:0 18px 35px rgba(0,0,0,.18);

}

.food-card img{

height:250px;

width:100%;

object-fit: cover;

}

.card-body{

text-align:center;

}

.category{

background:#fff3cd;

display:inline-block;

padding:6px 14px;

border-radius:20px;

font-size:14px;

margin-bottom:10px;

}

.price{

font-size:22px;

font-weight:700;

color:#198754;

}

.delete-btn{

width:100%;

margin-top:15px;

}

</style>

</head>

<body>

<div class="header">

<h1>🍽 Annapurna Admin</h1>

<p>Manage all dishes served in your restaurant</p>

</div>

<div class="container">

<div class="top-buttons">

<a href="/admin/add-food" class="btn btn-orange">

<i class="fa-solid fa-plus"></i>

Add New Dish

</a>

<a href="/admin/dashboard" class="btn btn-brown">

<i class="fa-solid fa-house"></i>

Dashboard

</a>

</div>

<div class="row" id="foodContainer">

</div>

</div>

<div class="container mt-3">

    <button
        class="btn btn-outline-warning rounded-pill px-4"
        onclick="history.back()">

        ← Back

    </button>

</div>

<script src="/js/manage-food.js"></script>

<footer class="text-center py-4 mt-5 bg-dark text-white">

    <h5>
        🍽 Annapurna
    </h5>

    <p class="mb-1">
        Pure Vegetarian Food Ordering System
    </p>


    <small>
        © 2026 Annapurna
    </small>

</footer>

</body>

</html>
