<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Food - Annapurna</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="/css/style.css">

    <style>

        body {
            background: #fff3dc;
        }

        .add-food-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            overflow: hidden;
        }

        .card-header {
            background: #ffb703;
            color: #111;
            font-size: 24px;
            font-weight: 700;
            padding: 18px 24px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 11px 14px;
        }

        .btn-save {
            background: #ffb703;
            border: none;
            color: #111;
            font-weight: 700;
            padding: 12px;
            border-radius: 10px;
        }

        .btn-save:hover {
            background: #f4a900;
        }

    </style>

</head>

<body>

    <div class="container py-4">

        <!-- Back Button -->

        <button
            class="btn btn-outline-warning rounded-pill mb-4"
            onclick="history.back()">

            ← Back

        </button>


        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card add-food-card">

                    <div class="card-header">

                        🍛 Add New Dish

                    </div>


                    <div class="card-body p-4">


                        <form
                            action="/admin/add-food"
                            method="POST"
                            enctype="multipart/form-data">


                            <!-- ========================= -->
                            <!-- Dish Name -->
                            <!-- ========================= -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Dish Name
                                </label>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    placeholder="Enter dish name"
                                    required>

                            </div>


                            <!-- ========================= -->
                            <!-- Price -->
                            <!-- ========================= -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Price (₹)
                                </label>

                                <input
                                    type="number"
                                    name="price"
                                    class="form-control"
                                    min="1"
                                    placeholder="Example: 199"
                                    required>

                            </div>


                            <!-- ========================= -->
                            <!-- Category -->
                            <!-- ========================= -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Category
                                </label>

                                <select
                                    name="category"
                                    class="form-select"
                                    required>

                                    <option value="">
                                        Select Category
                                    </option>

                                    <option value="North Indian">
                                        North Indian
                                    </option>

                                    <option value="South Indian">
                                        South Indian
                                    </option>

                                    <option value="Street Food">
                                        Street Food
                                    </option>

                                    <option value="Snacks">
                                        Snacks
                                    </option>

                                    <option value="Desserts">
                                        Desserts
                                    </option>

                                    <option value="Beverages">
                                        Beverages
                                    </option>


                                    <!-- Meal Packs -->

                                    <option value="Kids">
                                        👧 Kids Meal
                                    </option>

                                    <option value="Family">
                                        👨‍👩‍👧‍👦 Family Pack
                                    </option>

                                    <option value="Healthy">
                                        🥗 Healthy Meal
                                    </option>

                                    <option value="Breakfast">
                                        🍳 Breakfast Pack
                                    </option>

                                    <option value="Combo">
                                        ⭐ Special Combos
                                    </option>

                                </select>

                            </div>


                            <!-- ========================= -->
                            <!-- Food Type -->
                            <!-- ========================= -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Food Type
                                </label>

                                <select
                                    name="type"
                                    class="form-select"
                                    required>

                                    <option value="food">
                                        Regular Food
                                    </option>

                                    <option value="combo">
                                        ⭐ Combo Meal
                                    </option>

                                </select>

                            </div>


                            <!-- ========================= -->
                            <!-- Original Price -->
                            <!-- ========================= -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Original Price
                                </label>

                                <input
                                    type="number"
                                    name="originalPrice"
                                    class="form-control"
                                    min="0"
                                    placeholder="Example: 380">

                                <small class="text-muted">
                                    Use this for combo discounts.
                                </small>

                            </div>


                            <!-- ========================= -->
                            <!-- Discount -->
                            <!-- ========================= -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Discount
                                </label>

                                <input
                                    type="number"
                                    name="discount"
                                    class="form-control"
                                    min="0"
                                    placeholder="Example: 50">

                            </div>


                            <!-- ========================= -->
                            <!-- Special Offer -->
                            <!-- ========================= -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Special Offer
                                </label>

                                <input
                                    type="text"
                                    name="offer"
                                    class="form-control"
                                    placeholder="Example: Free Gulab Jamun">

                            </div>


                            <!-- ========================= -->
                            <!-- Food Image -->
                            <!-- ========================= -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Upload Food Image
                                </label>

                                <input
                                    type="file"
                                    name="image"
                                    class="form-control"
                                    accept="image/*"
                                    required>

                            </div>


                            <!-- ========================= -->
                            <!-- Save -->
                            <!-- ========================= -->

                            <button
                                type="submit"
                                class="btn btn-save w-100">

                                💾 Save Dish

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <footer class="text-center py-4">

        <h5>
            🍽 Annapurna
        </h5>

        <p class="mb-1">
            Pure Vegetarian Food Ordering System
        </p>

        <small>
            Made using HTML • CSS • JavaScript • Node.js • Express
        </small>

    </footer>

</body>

</html>
