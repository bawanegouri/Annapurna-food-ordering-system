<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Annapurna</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">Login</h2>

                    <form action="/login" method="POST">

                        <div class="mb-3">
                            <label>Email</label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required>

                            <div
                            id="emailError"
                            class="text-danger mt-1"
                            style="display:none;">
                            </div>
                        </div>

    <div class="mb-3">

    <label for="password" class="form-label">
        Password
    </label>

    <div class="input-group">

        <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Enter your password"
            required>

        <button
            type="button"
            class="btn btn-outline-secondary"
            onclick="togglePassword('password', 'passwordIcon')">

            <i
                class="bi bi-eye"
                id="passwordIcon">
            </i>

        </button>

    </div>

</div>
                        <button class="btn btn-warning w-100">
                            Login
                        </button>
                        
<script>

document.querySelector("form").addEventListener("submit", function (event) {

    const email =
        document.getElementById("email").value.trim();

    const emailError =
        document.getElementById("emailError");

    const emailPattern =
        /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.com$/;


    if (!emailPattern.test(email)) {

        event.preventDefault();

        emailError.innerText =
            "Please enter a valid email ending with .com";

        emailError.style.display =
            "block";

        document
            .getElementById("email")
            .focus();

        return;

    }


    emailError.style.display =
        "none";

});

</script>
                    </form>

                    <div class="text-center mt-3">
                        Don't have an account?
                        <a href="/register">Register</a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
<div class="container mt-3">

    <button
        class="btn btn-outline-warning rounded-pill px-4"
        onclick="history.back()">

        ← Back

    </button>

</div>
<br>
<footer class="text-center py-4 mt-5 bg-dark text-white">

    <h5>
        🍽 Annapurna
    </h5>

    <p class="mb-1">
        Pure Vegetarian Food Ordering System
    </p>


    <small>
        © 2026 Annapurna
    </small>

</footer>
<script>

function togglePassword(inputId, iconId) {

    const passwordInput =
        document.getElementById(inputId);

    const icon =
        document.getElementById(iconId);


    if (passwordInput.type === "password") {

        passwordInput.type = "text";

        icon.classList.remove("bi-eye");

        icon.classList.add("bi-eye-slash");

    } else {

        passwordInput.type = "password";

        icon.classList.remove("bi-eye-slash");

        icon.classList.add("bi-eye");

    }

}


document
    .querySelector("form")
    .addEventListener("submit", function(event) {

        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const emailError =
            document.getElementById("emailError");


        const emailPattern =
            /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.com$/;


        if (!emailPattern.test(email)) {

            event.preventDefault();

            emailError.innerText =
                "Please enter a valid email ending with .com";

            emailError.style.display =
                "block";

            document
                .getElementById("email")
                .focus();

            return;

        }


        emailError.style.display =
            "none";

    });

</script>
</body>
</html>
