<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Annapurna</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">Create Account</h2>

                    <form action="/register" method="POST">

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input
                                type="text"
                                class="form-control"
                                name="name"
                                required>
                        </div>

                       <div class="mb-3">

    <label for="email" class="form-label">
        Email
    </label>

    <input
        type="email"
        class="form-control"
        id="email"
        name="email"
        placeholder="example@gmail.com"
        required>

    <div
        id="emailError"
        class="text-danger mt-1"
        style="display:none;">
    </div>

</div>
                <div class="mb-3">

    <label for="password" class="form-label">
        Password
    </label>

    <div class="input-group">

        <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Create a password"
            required>

        <button
            type="button"
            class="btn btn-outline-secondary"
            onclick="togglePassword('password', 'passwordIcon')">

            <i
                class="bi bi-eye"
                id="passwordIcon">
            </i>

        </button>

    </div>

</div>
<div class="mb-3">

    <label for="confirmPassword" class="form-label">
        Confirm Password
    </label>

    <div class="input-group">

        <input
            type="password"
            class="form-control"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Re-enter your password"
            required>

        <button
            type="button"
            class="btn btn-outline-secondary"
            onclick="togglePassword(
                'confirmPassword',
                'confirmPasswordIcon'
            )">

            <i
                class="bi bi-eye"
                id="confirmPasswordIcon">
            </i>

        </button>

    </div>

    <div
        id="passwordError"
        class="text-danger mt-1"
        style="display:none;">
    </div>

</div>
                        <button class="btn btn-warning w-100">
                            Register
                        </button>

                    </form>

                    <div class="text-center mt-3">
                        Already have an account?
                        <a href="/login">
                            Login
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<div class="container mt-3">

    <button
        class="btn btn-outline-warning rounded-pill px-4"
        onclick="history.back()">

        ← Back

    </button>

</div>

<footer class="text-center py-4 mt-5 bg-dark text-white">

    <h5>
        🍽 Annapurna
    </h5>

    <p class="mb-1">
        Pure Vegetarian Food Ordering System
    </p>


    <small>
        © 2026 Annapurna
    </small>

</footer>
<script>

function togglePassword(inputId, iconId) {

    const input =
        document.getElementById(inputId);

    const icon =
        document.getElementById(iconId);


    if (input.type === "password") {

        input.type = "text";

        icon.classList.remove("bi-eye");

        icon.classList.add("bi-eye-slash");

    } else {

        input.type = "password";

        icon.classList.remove("bi-eye-slash");

        icon.classList.add("bi-eye");

    }

}


document
    .querySelector("form")
    .addEventListener("submit", function(event) {


        // =========================
        // EMAIL VALIDATION
        // =========================

        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const emailError =
            document.getElementById("emailError");


        const emailPattern =
            /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.com$/;


        if (!emailPattern.test(email)) {

            event.preventDefault();

            emailError.innerText =
                "Please enter a valid email ending with .com";

            emailError.style.display =
                "block";

            return;

        }


        emailError.style.display =
            "none";


        // =========================
        // PASSWORD MATCH
        // =========================

        const password =
            document
                .getElementById("password")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        const passwordError =
            document.getElementById("passwordError");


        if (password !== confirmPassword) {

            event.preventDefault();

            passwordError.innerText =
                "Passwords do not match.";

            passwordError.style.display =
                "block";

            return;

        }


        passwordError.style.display =
            "none";

    });

</script>
</body>
</html>
